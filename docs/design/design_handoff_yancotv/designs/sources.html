<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1920, initial-scale=1"/>
<title>YancoTV — Sources</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="yanco-ds.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  .src-scroll { scrollbar-width: none; }
  .src-scroll::-webkit-scrollbar { display:none; }

  /* labeled input */
  .yt-field-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .yt-field-input {
    padding: 14px 18px;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border-subtle);
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-primary);
    letter-spacing: 0.01em;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    display: block;
    width: 100%;
  }
  .yt-field-input:focus-within, .yt-field-input.focused {
    background: rgba(0,226,138,0.06);
    border: 1px solid var(--accent);
    box-shadow: 0 0 0 2px rgba(0,226,138,0.25), 0 0 18px rgba(0,226,138,0.2);
  }
  .yt-field-input.muted { color: var(--text-muted); }

  /* sub-flow tab row */
  .flow-tab {
    padding: 10px 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    text-transform: uppercase;
  }
  .flow-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* source row */
  .src-row {
    padding: 18px 22px;
    background: rgba(10,20,16,0.58);
    border: 1px solid var(--border-subtle);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 20px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
    clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px);
  }
  .src-row:hover {
    border-color: rgba(0,226,138,0.3);
    background: rgba(10,20,16,0.75);
  }
  .src-row.focused {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,226,138,0.35), 0 0 28px rgba(0,226,138,0.25);
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel" src="ds/ds.jsx"></script>
<script type="text/babel" data-presets="react">

// ==================================================================
// SOURCE DATA
// ==================================================================
const SOURCES = [
  { id:'brittbox', name:'BrittBox Premium', type:'Xtream Codes', host:'premium.brittbox.tv:8080', status:'ok',
    channels: 12480, movies: 24183, series: 5421, lastSync:'3m ago', exp:'2026-08-14', epg:true, active:true },
  { id:'iptvorg',  name:'iptv-org · public', type:'M3U URL', host:'raw.githubusercontent.com/…/playlist.m3u', status:'ok',
    channels: 8432, movies: 0, series: 0, lastSync:'18m ago', exp:null, epg:true, active:true },
  { id:'sbs',      name:'sbs-tv.xml',        type:'M3U URL', host:'sbs-tv.xml',    status:'syncing',
    channels: 1124, movies: 0, series: 0, lastSync:'syncing · 42%', exp:null, epg:true, active:true },
  { id:'samson',   name:'Samson Stalker',    type:'Stalker Portal', host:'sigma.samson-iptv.net/c/', status:'ok',
    channels: 2014, movies: 1180, series: 412, lastSync:'1h ago', exp:'2026-05-02', epg:false, active:true },
  { id:'legacy',   name:'Legacy tester',     type:'M3U File',       host:'/storage/emulated/0/Download/test.m3u', status:'error',
    channels: 0, movies: 0, series: 0, lastSync:'failed · 08:14', exp:null, epg:false, active:false },
];

function StatusPill({ status }) {
  if (status === 'ok') {
    return <HexChip tone="active" active>OK</HexChip>;
  } if (status === 'syncing') {
    return <div className="y-chip" style={{
      padding:'5px 14px', height:30, display:'inline-flex', alignItems:'center', gap:8,
      background:'rgba(102,240,181,0.1)', border:'1px solid rgba(102,240,181,0.35)',
      fontSize:11, fontWeight:700, letterSpacing:'0.12em', color:'var(--accent-soft)', fontFamily:'var(--font-mono)',
    }}>
      <div style={{
        width:10, height:10, borderRadius:'50%',
        border:'2px solid rgba(102,240,181,0.2)', borderTopColor:'var(--accent-soft)',
        animation:'hex-spin 0.8s linear infinite',
      }}/>
      SYNCING
    </div>;
  }
  return <HexChip tone="live">ERROR</HexChip>;
}

function SourceTypeChip({ type }) {
  const icons = { 'M3U URL': I.link, 'M3U File': I.folder, 'Xtream Codes': I.shield, 'Stalker Portal': I.globe };
  return <HexChip tone="muted" icon={icons[type]}>{type.toUpperCase()}</HexChip>;
}

// ==================================================================
// LEFT — SOURCE LIST
// ==================================================================
function SourceList({ selected, onSelect, onEdit, onAdd }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      <div style={{ padding:'28px 32px 14px 32px' }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:14 }}>
          <div className="kicker">YANCOTV · SOURCES</div>
          <div style={{ flex:1 }}/>
          <div className="mono tab-nums" style={{ fontSize:11, color:'var(--text-muted)', letterSpacing:'0.18em' }}>
            {SOURCES.length} CONFIGURED · {SOURCES.filter(s=>s.active).length} ACTIVE
          </div>
        </div>
        <div style={{ fontSize:40, fontWeight:900, letterSpacing:'-0.02em', marginTop:6, lineHeight:1 }}>Sources</div>
        <div style={{ fontSize:13, color:'var(--text-secondary)', marginTop:10, lineHeight:1.5, maxWidth:560 }}>
          Playlists and providers powering every channel, movie and series in YancoTV. Drag to reorder — top sources win when EPG and metadata collide.
        </div>

        {/* Toolbar */}
        <div style={{ display:'flex', gap:10, marginTop:22 }}>
          <HexBtn primary icon={I.plus} onClick={onAdd}>ADD SOURCE</HexBtn>
          <HexBtn icon={I.sync}>REFRESH ALL</HexBtn>
          <div style={{ flex:1 }}/>
          <HexBtn icon={I.external}>IMPORT .YANCO-BACKUP</HexBtn>
        </div>
      </div>

      {/* List */}
      <div className="src-scroll" style={{ flex:1, overflowY:'auto', padding:'8px 32px 32px 32px' }}>
        {SOURCES.map((s, i) => (
          <div key={s.id} onClick={()=>onSelect(s.id)}
            className={`src-row ${selected===s.id?'focused':''}`}>
            {/* drag */}
            <div style={{ color:'var(--text-muted)' }}><Icon path={I.drag} size={18}/></div>
            {/* index */}
            <div className="mono tab-nums" style={{ fontSize:11, color:'var(--text-muted)', letterSpacing:'0.12em', width:26 }}>
              {String(i+1).padStart(2,'0')}
            </div>
            {/* hex avatar */}
            <div className="y-hex" style={{
              width:52, height:52, display:'grid', placeItems:'center',
              background: s.status==='error'
                ? 'linear-gradient(135deg, rgba(255,107,107,0.18), rgba(0,0,0,0.4))'
                : 'linear-gradient(135deg, rgba(0,226,138,0.22), rgba(0,184,114,0.08))',
              border: s.status==='error'
                ? '1px solid rgba(255,107,107,0.5)'
                : '1px solid rgba(0,226,138,0.5)',
              color: s.status==='error' ? 'var(--error)' : 'var(--accent)',
              flexShrink:0,
            }}>
              <Icon path={s.type==='Xtream Codes'? I.shield : s.type==='Stalker Portal'? I.globe : s.type==='M3U URL'? I.link : I.folder} size={22}/>
            </div>

            {/* info */}
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <div style={{ fontSize:16, fontWeight:700, color:'var(--text-primary)' }}>{s.name}</div>
                {s.epg && <HexChip tone="muted">EPG</HexChip>}
                {!s.active && <HexChip tone="muted">DISABLED</HexChip>}
              </div>
              <div className="mono" style={{ fontSize:11, color:'var(--text-muted)', marginTop:4, letterSpacing:'0.04em', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                {s.host}
              </div>
              <div className="mono" style={{ fontSize:10, color:'var(--text-muted)', marginTop:6, letterSpacing:'0.18em', display:'flex', gap:14 }}>
                <span style={{ color:'var(--accent)' }}>{s.channels.toLocaleString()} CH</span>
                <span>{s.movies.toLocaleString()} VOD</span>
                <span>{s.series.toLocaleString()} SRS</span>
                <span>SYNC: {s.lastSync}</span>
                {s.exp && <span>EXP: {s.exp}</span>}
              </div>
            </div>

            {/* status */}
            <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:6 }}>
              <StatusPill status={s.status}/>
              <SourceTypeChip type={s.type}/>
            </div>
          </div>
        ))}
        <div style={{ marginTop:14, fontSize:11, color:'var(--text-muted)', textAlign:'center', fontFamily:'var(--font-mono)', letterSpacing:'0.14em' }}>
          — END OF LIST —
        </div>
      </div>
    </div>
  );
}

// ==================================================================
// RIGHT — DETAIL for selected
// ==================================================================
function SourceDetail({ id, onClose, onEdit }) {
  const s = SOURCES.find(x=>x.id===id) || SOURCES[0];
  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      {/* hero */}
      <div style={{
        padding:'28px 32px',
        background: s.status==='error'
          ? 'linear-gradient(135deg, rgba(255,107,107,0.1), transparent 60%)'
          : 'linear-gradient(135deg, rgba(0,226,138,0.08), transparent 60%)',
        borderBottom:'1px solid var(--border-subtle)',
      }}>
        <div style={{ display:'flex', alignItems:'flex-start', gap:18 }}>
          <div className="y-hex" style={{
            width:72, height:72, display:'grid', placeItems:'center',
            background: 'linear-gradient(135deg, rgba(0,226,138,0.25), rgba(0,184,114,0.05))',
            border:'1px solid rgba(0,226,138,0.5)',
            color: 'var(--accent)',
            flexShrink:0,
          }}>
            <Icon path={s.type==='Xtream Codes'? I.shield : s.type==='Stalker Portal'? I.globe : s.type==='M3U URL'? I.link : I.folder} size={32}/>
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <div className="kicker-d">SOURCE · DETAIL</div>
            <div style={{ fontSize:32, fontWeight:900, letterSpacing:'-0.02em', marginTop:4, lineHeight:1.05 }}>{s.name}</div>
            <div className="mono" style={{ fontSize:11, color:'var(--text-muted)', marginTop:6, letterSpacing:'0.04em' }}>{s.host}</div>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:8, alignItems:'flex-end' }}>
            <StatusPill status={s.status}/>
            <SourceTypeChip type={s.type}/>
          </div>
        </div>
      </div>

      {/* stats */}
      <div style={{ padding:'22px 32px', borderBottom:'1px solid var(--border-subtle)' }}>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:14 }}>
          {[
            { l:'CHANNELS', v:s.channels, c:'var(--accent)' },
            { l:'MOVIES',   v:s.movies,   c:'var(--text-primary)' },
            { l:'SERIES',   v:s.series,   c:'var(--text-primary)' },
            { l:'EPG ROWS', v: s.epg ? 214293 : 0, c:'var(--text-primary)' },
          ].map(m => (
            <div key={m.l} className="y-card" style={{ padding:'14px 18px', background:'rgba(10,20,16,0.6)', border:'1px solid var(--border-subtle)' }}>
              <div className="kicker-d">{m.l}</div>
              <div className="mono tab-nums" style={{ fontSize:24, fontWeight:900, color:m.c, marginTop:4 }}>
                {m.v.toLocaleString()}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* meta rows */}
      <div className="src-scroll" style={{ flex:1, overflowY:'auto', padding:'22px 32px' }}>
        <div style={{ marginBottom:8, display:'flex', alignItems:'baseline', gap:12 }}>
          <div style={{ fontSize:18, fontWeight:800 }}>Connection</div>
          <div style={{ flex:1, height:1, background:'linear-gradient(90deg, rgba(0,226,138,0.2), transparent)' }}/>
        </div>
        {[
          { l:'Type', v:s.type },
          { l:'Host', v:s.host, mono:true },
          { l:'User agent', v:'VLC/3.0.20 LibVLC/3.0.20', mono:true },
          { l:'Last sync', v:s.lastSync },
          { l:'Expires', v: s.exp || '— no expiry —' },
          { l:'EPG available', v: s.epg ? 'Yes · xmltv compatible' : 'No' },
        ].map(r => (
          <div key={r.l} style={{ display:'flex', padding:'10px 0', borderBottom:'1px solid var(--border-subtle)', alignItems:'center', gap:14 }}>
            <div className="mono" style={{ fontSize:11, color:'var(--text-muted)', letterSpacing:'0.12em', textTransform:'uppercase', width:140 }}>{r.l}</div>
            <div style={{ flex:1, fontSize:13, fontWeight:r.mono?600:700, color:'var(--text-primary)', fontFamily: r.mono?'var(--font-mono)':'inherit' }}>{r.v}</div>
          </div>
        ))}

        <div style={{ marginBottom:8, marginTop:28, display:'flex', alignItems:'baseline', gap:12 }}>
          <div style={{ fontSize:18, fontWeight:800 }}>Recent activity</div>
          <div style={{ flex:1, height:1, background:'linear-gradient(90deg, rgba(0,226,138,0.2), transparent)' }}/>
        </div>
        <div style={{ background:'rgba(0,0,0,0.25)', padding:'14px 18px', fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text-secondary)', lineHeight:1.8, clipPath:'polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px)' }}>
          <div><span style={{color:'var(--text-muted)'}}>14:21:03</span> · sync completed · 12,480 channels · 1.2s</div>
          <div><span style={{color:'var(--text-muted)'}}>14:14:01</span> · epg refresh · 214,293 programmes · 8.4s</div>
          <div><span style={{color:'var(--text-muted)'}}>13:42:58</span> · sync completed · 12,479 channels · 1.4s</div>
          <div><span style={{color:'var(--text-muted)'}}>13:32:11</span> · auth · token refreshed</div>
          <div><span style={{color:'var(--text-muted)'}}>12:02:44</span> · sync completed · 12,479 channels · 1.1s</div>
        </div>
      </div>

      {/* footer actions */}
      <div style={{
        padding:'18px 32px', borderTop:'1px solid var(--border-subtle)',
        display:'flex', gap:10,
      }}>
        <HexBtn primary icon={I.edit} onClick={onEdit}>EDIT</HexBtn>
        <HexBtn icon={I.sync}>SYNC NOW</HexBtn>
        <HexBtn icon={I.retry}>TEST CONNECTION</HexBtn>
        <div style={{ flex:1 }}/>
        <HexBtn icon={I.trash} style={{ color:'var(--error)', border:'1px solid rgba(255,107,107,0.4)' }}>DELETE</HexBtn>
      </div>
    </div>
  );
}

// ==================================================================
// ADD / EDIT FLOWS
// ==================================================================
function FieldStack({ children }) {
  return <div style={{ display:'flex', flexDirection:'column', gap:20 }}>{children}</div>;
}
function Field({ label, icon, children, hint }) {
  return (
    <div>
      <div className="yt-field-label">{icon && <Icon path={icon} size={11}/>} {label}</div>
      {children}
      {hint && <div style={{ fontSize:11, color:'var(--text-muted)', marginTop:6, lineHeight:1.5 }}>{hint}</div>}
    </div>
  );
}
function Input({ value, mono=true, muted, focused, ph }) {
  return (
    <div className={`yt-field-input ${muted?'muted':''} ${focused?'focused':''}`} style={{ fontFamily: mono?'var(--font-mono)':'inherit' }}>
      {value || <span style={{ color:'var(--text-faint)' }}>{ph}</span>}
    </div>
  );
}

function FlowM3UURL() {
  return (
    <FieldStack>
      <Field label="Name" icon={I.edit} hint="Shown in the sidebar, toasts and notifications.">
        <Input value="iptv-org · public" mono={false} focused/>
      </Field>
      <Field label="Playlist URL" icon={I.link} hint="Must return a text/plain response with #EXTM3U on the first line.">
        <Input value="https://raw.githubusercontent.com/iptv-org/iptv/master/streams/us.m3u"/>
      </Field>
      <Field label="EPG URL" icon={I.guide} hint="Optional. xmltv-compatible endpoint. Leave blank to use the default from the playlist.">
        <Input value="https://iptv-org.github.io/epg/guides/us.xml"/>
      </Field>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
        <Field label="User agent">
          <Input value="VLC/3.0.20 LibVLC/3.0.20"/>
        </Field>
        <Field label="Referer header (optional)">
          <Input muted ph="— none —"/>
        </Field>
      </div>
      <Field label="Request headers" icon={I.edit} hint="One `Key: Value` per line. Overrides any values set above.">
        <Input muted ph={'Authorization: Bearer …\nCookie: session=…'} />
      </Field>
    </FieldStack>
  );
}

function FlowM3UFile() {
  return (
    <FieldStack>
      <Field label="Name" icon={I.edit}>
        <Input value="Test playlist" mono={false}/>
      </Field>
      <Field label="Local file" icon={I.folder} hint="Must be a text file with .m3u or .m3u8 extension. Maximum 256MB.">
        <div style={{ display:'flex', gap:10 }}>
          <Input value="/storage/emulated/0/Download/test.m3u" focused/>
          <HexBtn icon={I.folder}>BROWSE…</HexBtn>
        </div>
      </Field>

      {/* File preview */}
      <div>
        <div className="yt-field-label"><Icon path={I.info} size={11}/> FILE PREVIEW</div>
        <div style={{
          padding:'14px 18px', background:'rgba(0,0,0,0.45)', border:'1px solid var(--border-subtle)',
          fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text-secondary)', lineHeight:1.8,
          clipPath:'polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px)',
          maxHeight:170, overflow:'hidden', position:'relative',
        }}>
          <div style={{ color:'var(--text-muted)' }}>#EXTM3U x-tvg-url="https://epg.example.com/guide.xml"</div>
          <div style={{ color:'var(--accent)' }}>#EXTINF:-1 tvg-id="cnn.us" tvg-logo="https://…/cnn.png" group-title="News",CNN HD</div>
          <div>https://example.com/live/cnn/index.m3u8</div>
          <div style={{ color:'var(--accent)' }}>#EXTINF:-1 tvg-id="bbc-one.uk" group-title="News",BBC One</div>
          <div>https://example.com/live/bbc-one/index.m3u8</div>
          <div style={{ color:'var(--accent)' }}>#EXTINF:-1 group-title="Sports",ESPN</div>
          <div>https://example.com/live/espn/index.m3u8</div>
          <div style={{ position:'absolute', left:0, right:0, bottom:0, height:48, background:'linear-gradient(180deg, transparent, rgba(0,0,0,0.9))' }}/>
        </div>
        <div className="mono" style={{ fontSize:10, color:'var(--text-muted)', letterSpacing:'0.14em', marginTop:8, display:'flex', gap:16 }}>
          <span>SIZE · 2.4 MB</span>
          <span>CHANNELS · 1,124 PARSED</span>
          <span>GROUPS · 18</span>
        </div>
      </div>

      <Field label="Auto-refresh" hint="File contents are re-read from disk at this interval.">
        <Input value="Never — manual only"/>
      </Field>
    </FieldStack>
  );
}

function FlowXtream() {
  return (
    <FieldStack>
      <Field label="Name" icon={I.edit}>
        <Input value="BrittBox Premium" mono={false}/>
      </Field>
      <Field label="Portal URL" icon={I.shield} hint="Base URL ending with a port, e.g. http://premium.brittbox.tv:8080">
        <Input value="http://premium.brittbox.tv:8080" focused/>
      </Field>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
        <Field label="Username" icon={I.key}>
          <Input value="0214-brt-7842"/>
        </Field>
        <Field label="Password" icon={I.lock}>
          <Input value="• • • • • • • • • • • • •"/>
        </Field>
      </div>
      <Field label="Output format" icon={I.play} hint="ts = MPEG-TS · m3u8 = HLS. HLS is more reliable on Wi-Fi.">
        <div style={{ display:'flex', gap:10 }}>
          <HexChip active>M3U8 · HLS</HexChip>
          <HexChip>TS</HexChip>
          <HexChip>RTMP</HexChip>
        </div>
      </Field>

      {/* Account info pane (appears after successful connect) */}
      <div className="y-card" style={{
        padding:'18px 22px', background:'rgba(0,226,138,0.06)', border:'1px solid rgba(0,226,138,0.4)',
      }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
          <Icon path={I.check} size={16} stroke="2.4" />
          <div style={{ fontSize:13, fontWeight:800, color:'var(--accent)', letterSpacing:'0.04em' }}>ACCOUNT VERIFIED</div>
          <div style={{ flex:1 }}/>
          <div className="mono" style={{ fontSize:10, color:'var(--text-muted)', letterSpacing:'0.14em' }}>RESPONSE · 142ms</div>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:14 }}>
          {[
            {l:'STATUS',     v:'Active',      c:'var(--accent)'},
            {l:'EXPIRES',    v:'2026-08-14',  c:'var(--text-primary)'},
            {l:'MAX CONN.',  v:'2',           c:'var(--text-primary)'},
            {l:'LIVE ·VOD ·SRS', v:'12,480 · 24,183 · 5,421', c:'var(--text-primary)'},
          ].map(x=>(
            <div key={x.l}>
              <div className="kicker-d">{x.l}</div>
              <div className="mono tab-nums" style={{ fontSize:14, fontWeight:800, color:x.c, marginTop:3 }}>{x.v}</div>
            </div>
          ))}
        </div>
      </div>
    </FieldStack>
  );
}

function FlowStalker() {
  return (
    <FieldStack>
      <Field label="Name" icon={I.edit}>
        <Input value="Samson Stalker" mono={false}/>
      </Field>
      <Field label="Portal URL" icon={I.globe} hint="Ends with /c/ or /stalker_portal/c/">
        <Input value="http://sigma.samson-iptv.net/c/" focused/>
      </Field>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
        <Field label="MAC address" icon={I.key} hint="Format: 00:1A:79:XX:XX:XX">
          <Input value="00:1A:79:C3:74:88"/>
        </Field>
        <Field label="Serial (optional)" icon={I.shield}>
          <Input muted ph="— none —"/>
        </Field>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
        <Field label="Device ID (derived)">
          <Input value="04B93A1DE7…" muted/>
        </Field>
        <Field label="Timezone">
          <Input value="Europe/Paris"/>
        </Field>
      </div>
      <Field label="Keep-alive interval" hint="Seconds between stalker token refreshes. Lower values use more battery on battery-powered TV boxes.">
        <Input value="60s"/>
      </Field>
    </FieldStack>
  );
}

function SourceAdd({ onClose }) {
  const [flow, setFlow] = uS('xtream');
  const flows = [
    { id:'m3u-url',  label:'M3U URL',  icon:I.link,   comp: FlowM3UURL, desc:'Public or authenticated playlist served over HTTP/HTTPS.' },
    { id:'m3u-file', label:'M3U File', icon:I.folder, comp: FlowM3UFile, desc:'Local .m3u / .m3u8 file on internal or USB storage.' },
    { id:'xtream',   label:'Xtream Codes', icon:I.shield, comp: FlowXtream, desc:'Portal + username + password. Delivers live, VOD and series.' },
    { id:'stalker',  label:'Stalker Portal', icon:I.globe, comp: FlowStalker, desc:'MAC-authenticated portal (tvheadend-style).' },
  ];
  const current = flows.find(f=>f.id===flow);
  const Comp = current.comp;

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      {/* header */}
      <div style={{ padding:'28px 32px 0 32px' }}>
        <div className="kicker">ADD SOURCE · WIZARD</div>
        <div style={{ fontSize:32, fontWeight:900, letterSpacing:'-0.02em', marginTop:6, lineHeight:1 }}>New source</div>
        <div style={{ fontSize:13, color:'var(--text-secondary)', marginTop:8, lineHeight:1.5, maxWidth:620 }}>
          Pick a connection type. YancoTV will verify the endpoint and import channel, VOD, series and EPG rows before the source becomes active.
        </div>

        {/* Flow switcher */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:12, marginTop:22 }}>
          {flows.map(f => {
            const a = f.id === flow;
            return (
              <div key={f.id} onClick={()=>setFlow(f.id)} className="y-card" style={{
                padding:'18px 16px', cursor:'pointer',
                background: a ? 'linear-gradient(135deg, rgba(0,226,138,0.18), rgba(0,226,138,0.02))' : 'rgba(10,20,16,0.55)',
                border: a ? '1px solid var(--accent)' : '1px solid var(--border-subtle)',
                boxShadow: a ? '0 10px 28px rgba(0,226,138,0.3), 0 0 0 1px rgba(0,226,138,0.15)' : 'none',
              }}>
                <div className="y-hex" style={{
                  width:44, height:44, display:'grid', placeItems:'center',
                  background: a ? 'linear-gradient(135deg, var(--accent), var(--accent-deep))' : 'rgba(255,255,255,0.04)',
                  color: a ? '#04130C' : 'var(--text-muted)',
                  marginBottom:10,
                  boxShadow: a ? '0 0 14px rgba(0,226,138,0.4)' : 'none',
                }}>
                  <Icon path={f.icon} size={20}/>
                </div>
                <div style={{ fontSize:15, fontWeight:800, color: a ? 'var(--text-primary)' : 'var(--text-secondary)', marginBottom:4 }}>{f.label}</div>
                <div style={{ fontSize:11, color:'var(--text-muted)', lineHeight:1.55 }}>{f.desc}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Form area */}
      <div className="src-scroll" style={{ flex:1, overflowY:'auto', padding:'28px 32px 24px 32px' }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:14, marginBottom:22 }}>
          <div style={{ fontSize:20, fontWeight:800 }}>Configure · {current.label}</div>
          <div style={{ flex:1, height:1, background:'linear-gradient(90deg, rgba(0,226,138,0.2), transparent 80%)' }}/>
          <HexChip tone="muted">STEP 2 / 3</HexChip>
        </div>
        <Comp />
      </div>

      {/* footer */}
      <div style={{
        padding:'18px 32px', borderTop:'1px solid var(--border-subtle)',
        display:'flex', gap:10, alignItems:'center',
        background:'rgba(0,0,0,0.28)',
      }}>
        <HexBtn onClick={onClose}>CANCEL</HexBtn>
        <HexBtn icon={I.retry}>TEST CONNECTION</HexBtn>
        <div style={{ flex:1 }}/>
        <div className="mono" style={{ fontSize:10, color:'var(--text-muted)', letterSpacing:'0.18em', marginRight:8 }}>STEP · SETUP / VERIFY / IMPORT</div>
        <HexBtn primary icon={I.check}>IMPORT &amp; ACTIVATE</HexBtn>
      </div>
    </div>
  );
}

// ==================================================================
// SHELL — switches view modes
// ==================================================================
function SourcesShell() {
  const [view, setView] = uS('detail'); // 'list-only' | 'detail' | 'add'
  const [selected, setSelected] = uS('brittbox');

  return (
    <Stage>
      <div className="bg-green-tint" style={{ position:'absolute', inset:0 }} />
      <div className="bg-hex-grid" style={{ position:'absolute', inset:0 }} />
      <CrumbBar here="SOURCES" />

      {/* Top-right view switcher */}
      <div style={{ position:'absolute', top:20, right:20, display:'flex', gap:8, zIndex:200 }}>
        <HexChip active={view==='detail'} onClick={()=>{ setView('detail'); setSelected('brittbox'); }}>LIST · DETAIL</HexChip>
        <HexChip active={view==='list-only'} onClick={()=>setView('list-only')}>LIST ONLY</HexChip>
        <HexChip active={view==='add'} onClick={()=>setView('add')}>ADD · WIZARD</HexChip>
      </div>

      {/* Layout */}
      <div style={{ position:'absolute', inset:'80px 48px 40px 48px', display:'flex', gap:24 }}>

        {/* List panel */}
        <div className="y-card-l" style={{
          flex: view==='list-only' ? 1 : '0 0 780px',
          background:'rgba(10,20,16,0.82)',
          backdropFilter:'blur(20px)',
          border:'1px solid var(--panel-border)',
          boxShadow:'0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04)',
          position:'relative', overflow:'hidden',
          display: view==='add' ? 'none' : 'flex',
          flexDirection:'column',
        }}>
          <SourceList selected={selected} onSelect={setSelected}
            onAdd={()=>setView('add')} onEdit={()=>setView('add')}/>
        </div>

        {/* Detail / Add panel */}
        {view !== 'list-only' && (
          <div className="y-card-l" style={{
            flex: 1,
            background:'rgba(10,20,16,0.78)',
            backdropFilter:'blur(20px)',
            border:'1px solid var(--panel-border)',
            boxShadow:'0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04)',
            position:'relative', overflow:'hidden',
            display:'flex', flexDirection:'column',
          }}>
            {view==='add'
              ? <SourceAdd onClose={()=>setView('detail')}/>
              : <SourceDetail id={selected} onEdit={()=>setView('add')} onClose={()=>setView('list-only')} />}
          </div>
        )}
      </div>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<SourcesShell />);
</script>
</body>
</html>
