<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1920, initial-scale=1"/>
<title>YancoTV — Live TV Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="yanco-ds.css"/>
<style>
  html, body { overflow: auto; background: #000; }
  .live-stage {
    width: 1920px; height: 1080px;
    position: relative; overflow: hidden;
    background: #000;
  }

  /* Live TV background — simulating a sports match / news feed */
  .tv-bg-sports {
    position:absolute; inset:0;
    background:
      radial-gradient(40% 60% at 50% 35%, rgba(80, 180, 70, 0.45), transparent 70%),
      radial-gradient(70% 40% at 50% 90%, rgba(30, 100, 50, 0.6), transparent 70%),
      linear-gradient(180deg, #1a3a2a 0%, #0a1a14 100%);
  }
  .tv-bg-sports::after {
    content:''; position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 60px);
  }
  .tv-bg-news {
    position:absolute; inset:0;
    background:
      radial-gradient(30% 40% at 30% 40%, rgba(200, 100, 80, 0.4), transparent 70%),
      linear-gradient(180deg, #0a0810 0%, #1a0810 100%);
  }

  .tv-bg-movie {
    position:absolute; inset:0;
    background:
      radial-gradient(40% 40% at 60% 40%, rgba(80, 40, 160, 0.5), transparent 70%),
      linear-gradient(135deg, #0a0820 0%, #100a30 100%);
  }

  /* Broadcaster watermark */
  .watermark {
    position:absolute;
    top: 24px; right: 48px;
    width: 64px; height: 64px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    display:grid; place-items:center;
    font-family: var(--font-mono); font-weight:900; font-size:18px; color:rgba(255,255,255,0.75);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  }

  /* Subtitle sample */
  .sub-track {
    position:absolute; left:50%; bottom:140px; transform:translateX(-50%);
    font-size: 22px; font-weight:500; color:#F0FFF6;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 6px #000;
    padding: 4px 14px;
    background: rgba(0,0,0,0.3);
    white-space: nowrap;
  }

  /* Buffer dots for reconnect */
  @keyframes live-pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
  .pulse-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin:0 3px; animation: live-pulse 1.2s ease-in-out infinite; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="app"></div>
<script type="text/babel" src="ds/ds.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" data-presets="react">

// =====================================================================
// CHANNEL data
// =====================================================================
const CHANNELS = [
  { n:101, name:'beIN SPORTS 1',      g:'4K | UHD 3840P',    now:'PSG vs Lyon · Ligue 1',      next:'Post-match · 23:00', prog:62, live:true },
  { n:102, name:'beIN SPORTS 2',      g:'4K | UHD 3840P',    now:'Tennis · ATP 1000 Madrid',   next:'Alcaraz vs Sinner', prog:38 },
  { n:103, name:'beIN SPORTS 3',      g:'Sports',            now:'Cycling · Giro Stage 14',    next:'Highlights', prog:82 },
  { n:201, name:'CNN International',  g:'News',              now:'Amanpour',                   next:'Global Brief', prog:15 },
  { n:202, name:'Al Jazeera English', g:'News',              now:'Inside Story',               next:'NewsHour', prog:45 },
  { n:203, name:'BBC World News',     g:'News',              now:'World Business Report',      next:'The Context', prog:72 },
  { n:501, name:'FX Movies',          g:'Movies',            now:'Dune: Part Two',             next:'Oppenheimer', prog:48 },
  { n:502, name:'MGM+',               g:'Movies',            now:'The Holdovers',              next:'Anatomy of a Fall', prog:22 },
];

const FOCUSED_CH = CHANNELS[0];

// =====================================================================
// Common: live backdrop element
// =====================================================================
function LiveBackdrop({ variant='sports' }) {
  if (variant === 'news') return <>
    <div className="tv-bg-news"/>
    {/* anchor box */}
    <div style={{ position:'absolute', left:'20%', right:'40%', top:'20%', bottom:'20%', background:'radial-gradient(ellipse at 30% 30%, rgba(255,200,160,0.45), transparent 60%)' }}/>
    {/* lower third banner */}
    <div style={{ position:'absolute', left:0, right:0, bottom:'22%', height:72, background:'linear-gradient(90deg, rgba(200,30,40,0.9) 0%, rgba(140,20,30,0.7) 100%)' }}/>
  </>;
  if (variant === 'movie') return <>
    <div className="tv-bg-movie"/>
    <div style={{ position:'absolute', left:'50%', top:'38%', width:280, height:280, transform:'translate(-50%,-50%)', background:'radial-gradient(circle, rgba(255,180,200,0.8) 0%, rgba(100,50,200,0.3) 50%, transparent 80%)', borderRadius:'50%', filter:'blur(4px)' }}/>
  </>;
  // sports
  return <>
    <div className="tv-bg-sports"/>
    {/* pitch lines */}
    <div style={{ position:'absolute', left:'10%', right:'10%', top:'48%', bottom:'20%', border:'2px solid rgba(255,255,255,0.1)' }}/>
    <div style={{ position:'absolute', left:'50%', top:'48%', bottom:'20%', width:2, background:'rgba(255,255,255,0.1)' }}/>
    <div style={{ position:'absolute', left:'50%', top:'68%', width:80, height:80, transform:'translate(-50%,-50%)', border:'2px solid rgba(255,255,255,0.1)', borderRadius:'50%' }}/>
  </>;
}

function ChannelWatermark({ label='beIN SPORTS' }) {
  return <div className="watermark">{label.split(' ')[0].slice(0,4)}</div>;
}

// =====================================================================
// STATE 1 · ZAP BAR (channel bar + minimal chrome)
// =====================================================================
function LiveZapBar() {
  return (
    <div className="live-stage">
      <LiveBackdrop variant="sports"/>
      <ChannelWatermark/>

      {/* TOP BAR — channel info */}
      <div style={{ position:'absolute', left:32, right:32, top:32, display:'flex', alignItems:'center', gap:14 }}>
        {/* Channel hex badge */}
        <div className="y-hex" style={{
          width:84, height:84, display:'grid', placeItems:'center',
          background:'linear-gradient(135deg, rgba(255,255,255,0.95), rgba(220,220,220,0.7))',
          color:'#0a1410', fontSize:18, fontWeight:900, fontFamily:'var(--font-mono)',
          boxShadow:'0 10px 24px rgba(0,0,0,0.5)',
          flexShrink:0,
        }}>bTV</div>

        {/* Channel info panel */}
        <div className="y-card-l" style={{
          flex:1, padding:'18px 28px',
          background:'rgba(10,20,16,0.72)', backdropFilter:'blur(20px)',
          border:'1px solid var(--panel-border)',
          display:'flex', alignItems:'center', gap:24,
        }}>
          <div className="mono tab-nums" style={{ fontSize:56, fontWeight:900, color:'var(--accent)', letterSpacing:'-0.02em', lineHeight:1, textShadow:'0 0 28px rgba(0,226,138,0.5)' }}>
            {String(FOCUSED_CH.n).padStart(3,'0')}
          </div>
          <div style={{ width:1, height:60, background:'rgba(255,255,255,0.15)' }}/>
          <div style={{ flex:1 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <HexChip tone="live" style={{ fontSize:10 }}>LIVE</HexChip>
              <HexChip tone="premium">4K · HDR</HexChip>
              <HexChip tone="muted">STEREO · EN</HexChip>
              <HexChip tone="muted">CC AVAILABLE</HexChip>
              <div className="mono tab-nums" style={{ fontSize:11, color:'var(--text-muted)', letterSpacing:'0.14em' }}>12.4 MBPS · 2160P</div>
            </div>
            <div style={{ fontSize:28, fontWeight:800, letterSpacing:'-0.01em', marginTop:8, lineHeight:1.1 }}>
              {FOCUSED_CH.name} <span style={{ color:'var(--text-muted)', fontWeight:500 }}>·</span> <span style={{ color:'var(--text-secondary)', fontWeight:600, fontSize:22 }}>{FOCUSED_CH.now}</span>
            </div>
          </div>
          <div style={{ textAlign:'right' }}>
            <div className="kicker-d">NEXT · 23:00</div>
            <div style={{ fontSize:14, fontWeight:700, color:'var(--text-primary)', marginTop:3 }}>{FOCUSED_CH.next}</div>
          </div>
          <div className="mono tab-nums" style={{ fontSize:20, fontWeight:700, color:'var(--text-primary)', paddingLeft:18, borderLeft:'1px solid rgba(255,255,255,0.15)', height:60, display:'flex', alignItems:'center', letterSpacing:'0.06em' }}>
            21:04
          </div>
        </div>
      </div>

      {/* Programme progress thin strip */}
      <div style={{ position:'absolute', left:32, right:32, top:132, display:'flex', alignItems:'center', gap:12 }}>
        <div className="mono tab-nums" style={{ fontSize:11, color:'var(--accent)', letterSpacing:'0.1em' }}>22:00</div>
        <div style={{ flex:1, height:3, background:'rgba(255,255,255,0.08)', position:'relative' }}>
          <div style={{ width:`${FOCUSED_CH.prog}%`, height:'100%', background:'linear-gradient(90deg, var(--accent-deep), var(--accent))', boxShadow:'0 0 8px rgba(0,226,138,0.6)' }}/>
          <div style={{ position:'absolute', left:`${FOCUSED_CH.prog}%`, top:-3, width:9, height:9, borderRadius:'50%', background:'var(--accent)', transform:'translateX(-50%)', boxShadow:'0 0 12px rgba(0,226,138,0.8)' }}/>
        </div>
        <div className="mono tab-nums" style={{ fontSize:11, color:'rgba(255,255,255,0.5)', letterSpacing:'0.1em' }}>23:00</div>
      </div>

      {/* Bottom zap bar — channel strip */}
      <div style={{ position:'absolute', left:0, right:0, bottom:0, padding:'30px 32px', background:'linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 40%)' }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:14, marginBottom:18 }}>
          <HexChip active>4K | UHD 3840P</HexChip>
          <HexChip tone="muted">◂ SPORTS</HexChip>
          <HexChip tone="muted">NEWS ▸</HexChip>
          <div style={{ flex:1 }}/>
          <div className="mono" style={{ fontSize:11, color:'rgba(255,255,255,0.5)', letterSpacing:'0.18em' }}><span style={{color:'var(--accent)'}}>▲▼</span> CHANGE GROUP · <span style={{color:'var(--accent)'}}>◀▶</span> CHANGE CHANNEL · <span style={{color:'var(--accent)'}}>●</span> LOCK ON</div>
        </div>

        <div style={{ display:'flex', gap:12 }}>
          {CHANNELS.slice(0, 7).map((c, i) => {
            const active = c.n === FOCUSED_CH.n;
            return (
              <div key={c.n} className="y-card" style={{
                flex:1, padding:'14px 18px',
                background: active ? 'linear-gradient(135deg, rgba(0,226,138,0.18), rgba(0,226,138,0.04))' : 'rgba(10,20,16,0.72)',
                border: active ? '1.5px solid var(--accent)' : '1px solid var(--border-subtle)',
                backdropFilter:'blur(16px)',
                boxShadow: active ? '0 0 0 3px rgba(102,240,181,0.3), 0 16px 40px rgba(0,226,138,0.35)' : '0 10px 24px rgba(0,0,0,0.5)',
                position:'relative',
              }}>
                <div className="mono tab-nums" style={{ fontSize:11, color: active ? 'var(--accent)':'var(--text-muted)', letterSpacing:'0.1em', fontWeight:700 }}>
                  {String(c.n).padStart(3,'0')}
                </div>
                <div style={{ fontSize:14, fontWeight:800, color: active? 'var(--text-primary)' :'var(--text-secondary)', marginTop:4, lineHeight:1.2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{c.name}</div>
                <div style={{ fontSize:11, color:'var(--text-muted)', marginTop:6, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{c.now}</div>
                <div style={{ marginTop:8, height:2, background:'rgba(255,255,255,0.08)' }}>
                  <div style={{ width:`${c.prog}%`, height:'100%', background: active ? 'var(--accent)' : 'rgba(255,255,255,0.3)' }}/>
                </div>
                {active && <div style={{ position:'absolute', top:-10, left:'50%', transform:'translateX(-50%)' }}><HexChip active>ON AIR</HexChip></div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// =====================================================================
// STATE 2 · INFO CARD (pressed INFO — richer info)
// =====================================================================
function LiveInfoCard() {
  return (
    <div className="live-stage">
      <LiveBackdrop variant="sports"/>
      <ChannelWatermark/>
      <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.35)' }}/>

      {/* Info panel */}
      <div className="y-card-l" style={{
        position:'absolute', left:48, right:48, bottom:48,
        padding:'32px 40px', background:'rgba(10,20,16,0.8)', backdropFilter:'blur(24px)',
        border:'1px solid var(--panel-border)', boxShadow:'0 30px 80px rgba(0,0,0,0.7)',
        display:'grid', gridTemplateColumns:'100px 1fr 400px', gap:36, alignItems:'center',
      }}>
        {/* hex logo */}
        <div className="y-hex" style={{
          width:96, height:96, display:'grid', placeItems:'center',
          background:'linear-gradient(135deg, rgba(255,255,255,0.95), rgba(220,220,220,0.7))',
          color:'#0a1410', fontSize:22, fontWeight:900, fontFamily:'var(--font-mono)',
          boxShadow:'0 10px 24px rgba(0,0,0,0.6)',
        }}>bTV</div>

        {/* main info */}
        <div>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
            <div className="mono tab-nums" style={{ fontSize:20, fontWeight:700, color:'var(--accent)', letterSpacing:'0.04em' }}>101</div>
            <div style={{ fontSize:22, fontWeight:700, color:'var(--text-primary)' }}>{FOCUSED_CH.name}</div>
            <HexChip tone="live">LIVE</HexChip>
            <HexChip tone="premium">4K · HDR</HexChip>
            <HexChip tone="muted">FAV</HexChip>
            <HexChip tone="muted">RECORDING</HexChip>
          </div>
          <div style={{ fontSize:44, fontWeight:900, letterSpacing:'-0.02em', lineHeight:1.05, color:'var(--text-primary)' }}>
            PSG vs Lyon
          </div>
          <div style={{ fontSize:15, color:'var(--text-secondary)', marginTop:8, lineHeight:1.5, maxWidth:820 }}>
            Ligue 1 · Matchday 31 · Parc des Princes. PSG need three points to clinch mathematical title with Monaco closing the gap; Lyon fighting for Europe. Commentary by Thomas Dubois and Clémentine Guérin.
          </div>

          {/* Progress bar */}
          <div style={{ marginTop:22 }}>
            <div style={{ display:'flex', alignItems:'center', gap:12, fontSize:11, fontFamily:'var(--font-mono)', color:'var(--text-muted)', letterSpacing:'0.12em', marginBottom:8 }}>
              <span>22:00</span>
              <div style={{ flex:1, height:4, background:'rgba(255,255,255,0.08)', position:'relative' }}>
                <div style={{ width:`${FOCUSED_CH.prog}%`, height:'100%', background:'linear-gradient(90deg, var(--accent-deep), var(--accent))', boxShadow:'0 0 8px rgba(0,226,138,0.6)' }}/>
                {/* now marker */}
                <div style={{ position:'absolute', left:`${FOCUSED_CH.prog}%`, top:-6, width:2, height:16, background:'var(--accent)', transform:'translateX(-50%)' }}/>
              </div>
              <span>23:00</span>
            </div>
            <div className="mono tab-nums" style={{ fontSize:11, color:'var(--text-muted)', letterSpacing:'0.14em' }}>
              36:38 ELAPSED · 22 REMAIN · 21:04 NOW
            </div>
          </div>
        </div>

        {/* Next up + actions */}
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          <div className="y-card" style={{ padding:'14px 18px', background:'rgba(20,37,31,0.5)', border:'1px solid var(--border-subtle)' }}>
            <div className="kicker-d">NEXT · 23:00</div>
            <div style={{ fontSize:16, fontWeight:800, color:'var(--text-primary)', marginTop:4 }}>Post-match · Live reaction</div>
            <div style={{ fontSize:11, color:'var(--text-muted)', marginTop:3 }}>30 min · Studio panel</div>
          </div>
          <div className="y-card" style={{ padding:'14px 18px', background:'rgba(20,37,31,0.5)', border:'1px solid var(--border-subtle)' }}>
            <div className="kicker-d">23:30 · 25 MIN AWAY</div>
            <div style={{ fontSize:14, fontWeight:700, color:'var(--text-secondary)', marginTop:3 }}>Ligue 1 Highlights</div>
          </div>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginTop:4 }}>
            <HexBtn primary icon={I.record}>RECORD</HexBtn>
            <HexBtn icon={I.favorites}>FAV</HexBtn>
            <HexBtn icon={I.bell}>REMIND</HexBtn>
            <HexBtn icon={I.menu}>MORE</HexBtn>
          </div>
        </div>
      </div>

      {/* top strip quick status */}
      <div style={{ position:'absolute', left:48, right:48, top:32, display:'flex', gap:10, alignItems:'center' }}>
        <HexChip active>4K | UHD 3840P</HexChip>
        <HexChip tone="live">ON AIR · 12.4 Mbps</HexChip>
        <div style={{ flex:1 }}/>
        <div className="mono tab-nums" style={{ fontSize:14, fontWeight:700, color:'rgba(255,255,255,0.85)' }}>21:04</div>
      </div>
    </div>
  );
}

// =====================================================================
// STATE 3 · TIMESHIFT / CATCH-UP
// =====================================================================
function LiveTimeshift() {
  return (
    <div className="live-stage">
      <LiveBackdrop variant="sports"/>
      <ChannelWatermark/>
      {/* desaturate for timeshift feel */}
      <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.3)', backdropFilter:'saturate(0.6)' }}/>

      {/* TOP: timeshift indicator */}
      <div style={{ position:'absolute', left:48, right:48, top:32, display:'flex', alignItems:'center', gap:14 }}>
        <HexChip active>4K | UHD 3840P</HexChip>
        <div className="y-chip" style={{
          padding:'6px 16px', height:36, display:'inline-flex', alignItems:'center', gap:10,
          background:'rgba(215,179,106,0.18)', border:'1px solid rgba(215,179,106,0.5)',
          color:'var(--premium)', fontSize:12, fontWeight:800, letterSpacing:'0.14em', fontFamily:'var(--font-mono)',
        }}>
          <Icon path={I.clock} size={14}/> TIMESHIFT · −00:12:34 BEHIND LIVE
        </div>
        <div style={{ flex:1 }}/>
        <HexChip tone="muted">CATCH-UP · 7 DAYS AVAILABLE</HexChip>
        <div className="mono tab-nums" style={{ fontSize:14, fontWeight:700, color:'rgba(255,255,255,0.85)' }}>21:04</div>
      </div>

      {/* Enormous shift readout — middle */}
      <div style={{ position:'absolute', left:0, right:0, top:'28%', textAlign:'center' }}>
        <div className="kicker-d">TIMESHIFTED PLAYBACK · REVIEWING</div>
        <div className="mono tab-nums" style={{ fontSize:160, fontWeight:900, letterSpacing:'-0.03em', lineHeight:1, marginTop:10,
          background:'linear-gradient(180deg, #F0FFF6 0%, #D7B36A 100%)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent',
        }}>20:51</div>
        <div className="mono" style={{ fontSize:16, color:'var(--text-muted)', letterSpacing:'0.2em', marginTop:8 }}>ACTUAL BROADCAST TIME · 13 MIN AGO</div>
      </div>

      {/* Transport controls */}
      <div style={{ position:'absolute', left:0, right:0, bottom:200, display:'flex', justifyContent:'center', gap:16 }}>
        <div className="y-chip" style={{
          width:56, height:56, display:'grid', placeItems:'center',
          background:'rgba(20,37,31,0.6)', backdropFilter:'blur(18px)',
          border:'1px solid rgba(255,255,255,0.15)',
        }}><Icon path={I.back10} size={22}/></div>
        <div className="y-chip" style={{
          width:80, height:80, display:'grid', placeItems:'center',
          background:'linear-gradient(180deg, var(--accent), var(--accent-deep))',
          color:'#04130C',
          boxShadow:'0 0 0 3px var(--focus-ring), 0 0 36px rgba(0,226,138,0.6)',
        }}><Icon path={I.play} size={32} stroke="0" fill="#04130C"/></div>
        <div className="y-chip" style={{
          width:56, height:56, display:'grid', placeItems:'center',
          background:'rgba(20,37,31,0.6)', backdropFilter:'blur(18px)',
          border:'1px solid rgba(255,255,255,0.15)',
        }}><Icon path={I.fwd10} size={22}/></div>
        <div style={{ width:20 }}/>
        <HexBtn primary icon={I.signal} height={56}>JUMP TO LIVE</HexBtn>
        <HexBtn icon={I.record} height={56}>RECORD FROM HERE</HexBtn>
      </div>

      {/* Bottom: timeline bar showing live edge */}
      <div style={{ position:'absolute', left:48, right:48, bottom:48 }}>
        <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:10, fontSize:11, fontFamily:'var(--font-mono)', color:'var(--text-muted)', letterSpacing:'0.14em' }}>
          <span>22:00 START</span>
          <div style={{ flex:1 }}/>
          <span style={{ color:'var(--premium)' }}>● YOU HERE · 20:51</span>
          <div style={{ flex:1 }}/>
          <span style={{ color:'var(--error)' }}>● LIVE EDGE · 21:04</span>
        </div>
        <div style={{ height:12, background:'rgba(255,255,255,0.08)', position:'relative', clipPath:'polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%)' }}>
          {/* available catch-up span */}
          <div style={{ position:'absolute', top:0, left:0, width:'80%', height:'100%', background:'linear-gradient(90deg, rgba(215,179,106,0.3), rgba(0,226,138,0.5))' }}/>
          {/* Live edge marker */}
          <div style={{ position:'absolute', left:'80%', top:-8, width:3, height:28, background:'var(--error)', transform:'translateX(-50%)', boxShadow:'0 0 10px rgba(255,59,59,0.6)' }}/>
          {/* playhead */}
          <div style={{ position:'absolute', left:'60%', top:'50%', transform:'translate(-50%,-50%)', width:22, height:22, borderRadius:'50%', background:'var(--premium)', boxShadow:'0 0 0 5px rgba(215,179,106,0.3), 0 0 18px rgba(215,179,106,0.7)' }}/>
        </div>

    { t:'13:00', dur:30,  title:'News at One',          viewed:false, fav:false },

      </div>

      {/* Day selector */}
      <div style={{ position:'absolute', left:48, right:48, top:232, display:'flex', gap:8 }}>
        {days.map(d => {
          const a = d === currentDay;
          return (
            <div key={d} className="y-chip" style={{
              padding:'0 20px', height:44, display:'inline-flex', alignItems:'center', gap:8,
              background: a ? 'linear-gradient(180deg, var(--accent), var(--accent-deep))' : 'rgba(20,37,31,0.6)',

              const startH = parseInt(s.t.slice(0,2)) + parseInt(s.t.slice(3))/60;
              const leftPct = ((startH - 6) / 8) * 100;
              const widthPct = (s.dur / 60 / 8) * 100;
              return (
                <div key={i} className="y-card" style={{
                  position:'absolute', top:0, bottom:0,

                  <div style={{ display:'flex', gap:5, marginTop:6 }}>

                  </div>
                </div>

            })}
          </div>

          {/* Selected detail */}
          <div style={{
            marginTop:14, padding:'20px 24px', background:'rgba(10,20,16,0.7)', border:'1px solid var(--panel-border)',
            display:'grid', gridTemplateColumns:'280px 1fr 280px', gap:28, alignItems:'center',

              <div style={{ fontSize:32, fontWeight:900, letterSpacing:'-0.01em', marginTop:6 }}>Euro Affairs</div>
              <div style={{ fontSize:13, color:'var(--text-secondary)', marginTop:8, lineHeight:1.5, maxWidth:640 }}>
                Weekly debate on European policy. This episode examines energy-security proposals ahead of next week's Council summit, with commentary from Brussels correspondents.
              </div>
              <div style={{ display:'flex', gap:8, marginTop:14 }}>
                <HexChip tone="muted">NEWS</HexChip>
                <HexChip tone="muted">EN</HexChip>
                <HexChip tone="muted">CC</HexChip>
                <HexChip tone="premium">SAVED</HexChip>
              </div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <HexBtn primary icon={I.play}>PLAY · 00:00 START</HexBtn>
              <HexBtn icon={I.record}>KEEP FOREVER</HexBtn>
              <HexBtn icon={I.favorites}>UNFAV</HexBtn>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

        <div className="y-chip" style={{
          padding:'6px 16px', height:36, display:'inline-flex', alignItems:'center', gap:10,
          background:'rgba(255,59,59,0.2)', border:'1px solid rgba(255,59,59,0.5)',

        <HexBtn primary icon={I.retry} height={56}>RECONNECT NOW</HexBtn>
        <HexBtn icon={I.sync} height={56}>SWITCH TO 1080P</HexBtn>
        <HexBtn icon={I.shield} height={56}>TRY ANOTHER SOURCE</HexBtn>
        <HexBtn icon={I.chevL} height={56}>CANCEL · BACK TO GUIDE</HexBtn>
      </div>
    </div>
  );
}
