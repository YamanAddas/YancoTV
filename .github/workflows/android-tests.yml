name: Android tests

# MK.24 / MB-224 — runs the Android unit-test suite + a debug APK build on
# every push to master + every PR targeting master. Closes the gap that hid
# MB-223 (compile-broken `:shared:androidUnitTest` after f157250's auto-sync
# column add) for 24 hours and would have hidden any future test breakage
# the same way.
#
# Scope (kept tight):
#   * `:shared:testDebugUnitTest` — the JVM-flavored shared-module suite.
#   * `:app:testDebugUnitTest` — the Android-app-side unit tests (PlaybackController
#     decision functions, SourceSyncCoordinator re-entrancy + lifecycle, etc).
#   * `:app:assembleDebug` — pins that the Android app still BUILDS, not just
#     compiles tests. Catches missing resources / manifest changes / DI breakage.
#   * `ktlintCheck` — style gate. Enforceable as of 2026-07-25: the repo was
#     `ktlintFormat`-clean in the same commit that added this step.
#   * `:shared:verifyCommonMainYancoDbMigration` — SQLDelight replays the .sqm
#     ladder against the schema. Runs EXPLICITLY (see the correction below).
#   * `:app:assembleRelease` — the R8/minify path. This is the step that would
#     have caught the MK.26 Ktor `java.lang.management` R8 abort, which was
#     found by hand instead. Needs `-PallowUnsignedRelease` because CI has no
#     keystore; see app/build.gradle.kts for why that flag has to be explicit.
#
# CORRECTION 2026-07-25 — this header previously claimed the Windows-only
# guard on `verifyCommonMainYancoDbMigration` "does NOT fire here (Linux
# runner), so SQLDelight's build-time migration verification runs — exactly
# the safety net we want CI to enforce." That was false. The task is enabled
# on Linux, but SQLDelight wires it into `check`, and none of the steps below
# depended on `check` — `assembleDebug` and `testDebugUnitTest` do not pull it
# in (verified with `--dry-run`). The migration ladder WAS still covered, by
# `MigrationTest.kt` in `:shared:androidUnitTest` at runtime, so this was a
# documentation bug rather than an uncovered gap — but a documented-and-false
# gate is worse than no gate, so the task is now an explicit step.
#
# Out of scope (for now — file as future MK if pursued):
#   * Instrumented tests (`androidTest/`) — none exist today.
#   * `lintRelease` — NOT enforced yet. It currently reports 24 errors on top
#     of an already-stale `lint-baseline.xml` (which filters 58 more). Adding
#     it as a gate today would just break CI, and regenerating the baseline
#     would bury them — two of the NewApi hits were real API-26-on-minSdk-24
#     crashes (MB-294, same class as the MB-241 Fire OS 6 startup crash), so
#     they deserve fixing, not baselining. Enable this step once the error
#     count is zero.
#   (was: "iOS targets belong in a separate macOS workflow" — now covered by
#   the `ios` job below, added 2026-08-10. Keeping it in this file rather than
#   a separate workflow so a PR shows one status check set, not two.)
#
# CI-environment notes:
#   * `local.properties` is intentionally absent on CI — Sentry DSN handling
#     in `app/build.gradle.kts` already treats missing file as "Sentry off"
#     (the runtime init is a silent no-op when SENTRY_DSN is empty). Same
#     for the Sentry auth token. So CI builds without secrets.
#   * The Windows-only guard on `:shared:verifyCommonMainYancoDbMigration`
#     does NOT fire here (Linux runner), so SQLDelight's build-time migration
#     verification runs — exactly the safety net we want CI to enforce.
#   * Debug keystore is auto-generated by AGP on first build if absent.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs when a new commit lands on the same ref.
# Saves CI minutes on rapid-fire pushes during a session.
concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        # Gradle root for the Android side. The repo also has a Node/Electron
        # root at the top, but those are unrelated to the Android build path.
        working-directory: packages/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # Temurin (Eclipse Adoptium) is the closest free public stand-in
          # for the Android Studio JBR our local builds use. Both target
          # JVM 17 — `jvmTarget = "17"` + `JavaVersion.VERSION_17` per
          # build.gradle.kts.
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pins to the same compileSdk = 35 the project targets. Auto-accepts
          # licenses + installs platforms;android-35 + build-tools.
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Cache by gradle-wrapper.properties + every build.gradle.kts +
          # libs.versions.toml so a dependency bump invalidates the cache.
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/android/gradle/wrapper/gradle-wrapper.properties', 'packages/android/**/build.gradle.kts', 'packages/android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        # Belt-and-suspenders alongside `git update-index --chmod=+x` —
        # on Windows-authored repos the executable bit can drift if
        # `core.fileMode` is false locally. `chmod +x` is idempotent;
        # cheap insurance.
        run: chmod +x ./gradlew

      - name: Check code style (ktlint)
        # First — it's the fastest gate, so a style-only break fails in
        # seconds instead of after the full test + build cycle.
        run: ./gradlew :shared:ktlintCheck :app:ktlintCheck --console=plain --stacktrace

      - name: Verify SQLDelight migrations
        # The build-time task the header used to claim was already covered.
        # Disabled on Windows hosts (sqlite-jdbc native-link failure against
        # the Android Studio JBR) but fully functional on this Linux runner.
        run: ./gradlew :shared:verifyCommonMainYancoDbMigration --console=plain --stacktrace

      - name: Run :shared:testDebugUnitTest
        run: ./gradlew :shared:testDebugUnitTest --console=plain --stacktrace

      - name: Run :app:testDebugUnitTest
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Build :app:assembleDebug
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Build :app:assembleRelease (R8)
        # Exercises minification + resource shrinking + the ProGuard rules,
        # which the debug build never touches. R8 has already broken this
        # project once (MK.26 Ktor -> java.lang.management) and was caught
        # only by a manual pre-release build.
        #
        # `-PallowUnsignedRelease` opts into the debug-signing fallback. CI
        # has no release keystore and never should; the resulting APK is a
        # build artifact for R8 validation and is NOT distributable. Without
        # the flag this build fails by design, so a local `assembleRelease`
        # can't silently produce an undistributable debug-signed APK.
        run: ./gradlew :app:assembleRelease -PallowUnsignedRelease=true --console=plain --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            packages/android/app/build/reports/tests/
            packages/android/shared/build/reports/tests/
            packages/shared/build/reports/tests/
          retention-days: 14

  ios:
    # Added 2026-08-10. The `:shared` module has declared iosX64 / iosArm64 /
    # iosSimulatorArm64 targets since MK.0.1, but nothing ever compiled them:
    # the Android build doesn't, and the `test` job above runs on Linux where
    # Kotlin/Native can't build Apple targets. They rotted undetected —
    # MK.19.8 added `BackupCipher` and `sha256Hex` as `expect` in commonMain
    # and never wrote the iOS `actual`s, which is a hard compile error on the
    # iOS targets alone. This job is the detector.
    #
    # Runs independently of `test` (no `needs:`) so an iOS-only break is
    # distinguishable at a glance from an Android one.
    name: iOS targets compile
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: packages/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # Required even though this job never builds the Android app:
        # `:shared` applies the `com.android.library` plugin, so Gradle
        # cannot CONFIGURE the project without an SDK ("SDK location not
        # found") — configuration failure would happen long before the
        # iOS compile tasks run.
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle and Kotlin/Native
        # `~/.konan` holds the Kotlin/Native toolchain + Apple platform
        # klibs — a multi-hundred-MB download on a cold runner. Without it
        # the job spends most of its wall-clock fetching the compiler.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-konan-${{ runner.os }}-${{ hashFiles('packages/android/gradle/wrapper/gradle-wrapper.properties', 'packages/android/**/build.gradle.kts', 'packages/android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-konan-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile all iOS targets
        # The gate. Compiles main + test klibs for all three iOS targets.
        # A missing `actual` in iosMain fails here.
        run: ./gradlew :shared:checkIosCompile --console=plain --stacktrace

      - name: Run backup cipher parity suite on the iOS simulator
        # Compiling proves the CommonCrypto bindings RESOLVE; it does not
        # prove they are CORRECT. This step executes BackupCipherParityTest
        # on a real simulator, pinning the iOS PBKDF2 / AES-GCM / SHA-256
        # output against fixed vectors the Android actual produced. A
        # divergence here means a password-protected backup written on one
        # platform cannot be restored on the other.
        #
        # Scoped with --tests to this one class on purpose: the rest of
        # commonTest has never run on a native target and may need its own
        # shake-out. Widen to the full `:shared:iosSimulatorArm64Test` once
        # that has been done.
        run: ./gradlew :shared:iosSimulatorArm64Test --tests "com.yancotv.shared.backup.BackupCipherParityTest" --console=plain --stacktrace

      - name: Upload iOS test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: packages/shared/build/reports/tests/
          retention-days: 14
