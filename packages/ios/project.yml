# YancoTV iOS — XcodeGen project definition (MK.iOS.0).
#
# Regenerate the .xcodeproj after editing this file:
#   xcodegen generate          (from packages/ios/)
#
# The Kotlin `shared` framework is built by the "Build Shared KMP
# Framework" pre-build phase below, which shells out to the Gradle
# wrapper in ../android (the KMP module is a subproject of that build).
# `embedAndSignAppleFrameworkForXcode` reads Xcode's CONFIGURATION /
# SDK_NAME / ARCHS env vars and drops the right framework slice into
# ../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME), which
# FRAMEWORK_SEARCH_PATHS points at. The framework is static
# (isStatic = true in shared/build.gradle.kts), so there is nothing to
# embed at runtime — link flags are all that is needed.
name: YancoTV
options:
  bundleIdPrefix: com.yancotv
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "6.0"
packages:
  # MK.iOS.3b — the software decoder. AVPlayer speaks HLS and MP4 but not
  # raw MPEG-TS, which a large share of live IPTV still serves; every
  # serious iOS IPTV player bundles a decoder for exactly this reason.
  #
  # LGPLv2.1-or-later. VideoLAN relicensed libVLC from GPL specifically to
  # make App Store distribution possible (VLC itself returned to the store
  # in 2013 on that basis), so a closed-source app may link it — dynamically,
  # with attribution and an offer of source. See docs/LICENSES.md.
  #
  # An SPM wrapper rather than CocoaPods: Pods would mean a workspace and a
  # second source of project truth alongside XcodeGen.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: 3.5.1
targets:
  YancoTV:
    type: application
    platform: iOS
    sources:
      - path: YancoTV
    dependencies:
      - package: VLCKitSPM
    info:
      path: YancoTV/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Cleartext traffic — the same deliberate, accepted threat-model
        # decision the Android manifest records with
        # `android:usesCleartextTraffic="true"`. See the "Cleartext traffic"
        # section in AGENTS.md; that rationale is authoritative and this is
        # its iOS half.
        #
        # Why: IPTV providers routinely serve plain HTTP — playlists,
        # `player_api.php`, MPEG-TS streams, XMLTV dumps. The host set is
        # user-configured at runtime, so a static ATS exception domain list
        # cannot be written ahead of time; ATS is read once from this plist
        # and has no runtime mutation API, exactly as Android's
        # network_security_config has none.
        #
        # What it exposes: someone on the same Wi-Fi can MITM provider
        # traffic. Xtream credentials already travel in those URLs as query
        # parameters, so cleartext does not make that materially worse.
        #
        # What it must NOT become: a licence for credential-bearing HTTP to
        # anywhere outside a user-configured provider host. Android answers
        # this with an application-layer allow-list seeded from the
        # `sources` table (MK.SEC.A/B/C, bugs.md MB-203). **iOS has no
        # equivalent yet** — that is the open half of this decision and is
        # tracked as MK.iOS.SEC. Flag any new plain-HTTP call site in review
        # until it lands.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yancotv.ios
        PRODUCT_NAME: YancoTV
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # The Gradle pre-build phase writes framework outputs outside the
        # target's declared inputs/outputs; Xcode's user-script sandbox
        # would block it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
          # SQLDelight's NativeSqliteDriver (SQLiter) binds the system
          # sqlite3; a static Kotlin framework doesn't carry the library,
          # so the app links it.
          - "-lsqlite3"
    preBuildScripts:
      - name: Build Shared KMP Framework
        basedOnDependencyAnalysis: false
        script: |
          # Xcode strips the login shell's environment; point JAVA_HOME at
          # the Homebrew OpenJDK 17 this repo builds with unless the caller
          # already exported one.
          export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk@17}"
          cd "$SRCROOT/../android"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
