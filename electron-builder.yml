appId: com.yancotv.app
productName: YancoTV
copyright: Copyright © 2026 Yaman
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - src/assets/**/*
  - node_modules/ffmpeg-static/**/*
asarUnpack:
  - node_modules/ffmpeg-static/ffmpeg*
extraResources:
  - from: mpv/
    to: mpv/
    filter:
      - "**/*"
fileAssociations:
  - ext: m3u
    name: M3U Playlist
    description: IPTV playlist
    role: Viewer
  - ext: m3u8
    name: HLS Playlist
    description: HTTP Live Streaming playlist
    role: Viewer
win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  icon: src/assets/icon.ico
  publisherName: Yaman
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: true
  shortcutName: YancoTV
  uninstallDisplayName: ${productName} ${version}
  runAfterFinish: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: "${productName}-${version}-portable.exe"
